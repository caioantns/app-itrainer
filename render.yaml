services:
  - type: web
    name: itrainer
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase: {name: itrainer-db, property: connectionString}
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
databases:
  - name: itrainer-db
    plan: free
    databaseName: itrainer
